[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analyser-api"
version = "0.1.0"
description = "FastAPI service for the call analyser."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "call-analyser",
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "PyJWT>=2.10,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
analyser-api = "analyser_api.cli:main"

[tool.uv.sources]
call-analyser = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_api"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["boto3", "call_analyser.*"]
ignore_missing_imports = true
