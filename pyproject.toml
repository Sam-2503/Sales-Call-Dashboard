[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-analyser"
version = "0.1.0"
description = "Evidence-backed sales-call analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["chromadb==1.5.0", "langchain==1.2.12", "langchain-chroma==1.1.0", "langchain-google-genai==4.2.1", "librosa==0.11.0", "numpy==2.4.3", "pydantic==2.12.5", "pydantic-settings==2.13.1", "pypdf==6.9.1", "pyyaml==6.0.3", "rapidfuzz==3.14.3", "soundfile==0.13.1"]

[project.optional-dependencies]
eval = ["scikit-learn==1.8.0"]
dev = ["mypy==1.19.1", "ruff==0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/call_analyser"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml", "soundfile"]
ignore_missing_imports = true
